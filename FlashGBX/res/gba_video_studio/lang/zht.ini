force_i_threshold_tooltip = 若變動區塊比例超過此值，則強制產生 I-影格
codebook_size = 碼本大小 (Codebook)：
codebook_size_tooltip = VQ 碼本條目數量。數值越大 = 品質越好
kmeans_iterations = K-means 迭代次數：
kmeans_iterations_tooltip = 碼本訓練的迭代次數。數值越多 = 品質越好，編碼越慢
iframe_weight = I-影格權重：
iframe_weight_tooltip = 碼本分群中 I-影格區塊的權重乘數
motion_threshold = 移動閾值：
motion_threshold_tooltip = 在 8×8 MC 候選區塊中，最多更新的 2×2 子區塊數量
floyd_steinberg_dithering = Floyd-Steinberg 抖動
floyd_steinberg_dithering_tooltip = 減少色帶效應，對檔案大小影響微乎其微
motion_compensation = 移動補償
motion_compensation_tooltip = 停用可加速編碼，但會使 P-影格變大

