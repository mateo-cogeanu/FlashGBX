; ── Video Parameters ──────────────────────────────────────────────────────────
video_parameters = 视频参数
target_fps = 目标 FPS：
iframe_interval = I-帧间隔：
iframe_interval_tooltip = 关键帧之间的帧数。数值越小 = 搜索性能越好，文件越大
diff_threshold = 差异阈值：
diff_threshold_tooltip = 标记区块为变动的最小 Y 通道 MSE 值。数值越低 = 画面越锐利，文件越大
variance_threshold = 方差阈值：
variance_threshold_tooltip = 用于区分纯色区块与纹理区块的 MSE 阈值
color_fallback = 颜色退回：
color_fallback_tooltip = 纯色区块切换至纹理编码的距离阈值
force_i_threshold = 强制 I-帧阈值：
force_i_threshold_tooltip = 若变动区块比例超过此值，则强制产生 I-帧
codebook_size = 码本大小 (Codebook)：
codebook_size_tooltip = VQ 码本条目数量。数值越大 = 质量越好
kmeans_iterations = K-means 迭代次数：
kmeans_iterations_tooltip = 码本训练的迭代次数。数值越多 = 质量越好，编码越慢
iframe_weight = I-帧权重：
iframe_weight_tooltip = 码本分群中 I-帧区块的权重乘数
motion_threshold = 运动阈值：
motion_threshold_tooltip = 在 8×8 MC 候选区块中，最多更新的 2×2 子区块数量
floyd_steinberg_dithering = Floyd-Steinberg 抖动
floyd_steinberg_dithering_tooltip = 减少色带效应，对文件大小影响微乎其微
motion_compensation = 运动补偿
motion_compensation_tooltip = 停用可加速编码，但会使 P-帧变大

